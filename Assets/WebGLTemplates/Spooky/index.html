<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0724">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="{{{ PRODUCT_NAME }}}">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0f0724; overflow: hidden;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #0f0724; outline: none; }
      /* Desktop: show the portrait game in a phone-shaped frame. */
      body.desktop #unity-canvas { width: auto; height: 94vh; aspect-ratio: 9 / 19.5; border-radius: 28px;
        box-shadow: 0 0 0 6px #2a1650, 0 20px 80px rgba(155, 92, 255, .35); }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 28px; background: radial-gradient(circle at 50% 40%, #3a1a62 0%, #0f0724 70%); transition: opacity .4s; }
      #loading img { width: min(80vw, 420px); animation: bob 1.6s ease-in-out infinite; }
      #bar { width: min(70vw, 360px); height: 18px; border-radius: 9px; background: #1a0b33; box-shadow: inset 0 0 0 3px #2a1240; overflow: hidden; }
      #fill { height: 100%; width: 0; border-radius: 9px; background: linear-gradient(#c4f7e3, #3fd39f); transition: width .2s; }
      #hint { color: #a99bd0; font: 600 14px system-ui, -apple-system, sans-serif; text-align: center; padding: 0 24px; }
      @keyframes bob { 50% { transform: translateY(-8px) rotate(-1.5deg); } }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading">
      <img src="TemplateData/logo.png" alt="">
      <div id="bar"><div id="fill"></div></div>
      <div id="hint">Waking up the pals…<br>Tip: "Add to Home Screen" keeps your collections safe.</div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
      if (!isMobile) document.body.classList.add("desktop");

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Phones have 3x screens; 2x is plenty for this art and keeps the frame rate up.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, function (progress) {
        document.getElementById("fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        var loading = document.getElementById("loading");
        loading.style.opacity = 0;
        setTimeout(function () { loading.remove(); }, 450);
      }).catch(function (message) {
        document.getElementById("hint").textContent = "Couldn't start the game: " + message;
      });
    </script>
  </body>
</html>
